services:
  db:
    image: postgres:17-alpine
    container_name: climachile-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clima_chile}
      POSTGRES_USER: ${POSTGRES_USER:-clima_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en POC-Docker/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: unless-stopped
    networks:
      - climachile-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: climachile-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - FLASK_DEBUG=True
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clima_app}:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en POC-Docker/.env}@db:5432/${POSTGRES_DB:-clima_chile}
    depends_on:
      - db

    
    restart: unless-stopped
    networks:
      climachile-net:
        aliases:
          - backend
          - climachile-backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: climachile-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - climachile-net

networks:
  climachile-net:
    driver: bridge
volumes:
  postgres-data:
    driver: local